# One entry per employer; roles are newest first. `logo` is a file in site/public/logos/
# (the company's own mark, website only).
work:
  - company: Bankino
    url: https://bankino.digital/
    logo: /logos/bankino.svg
    location: Tehran, Iran
    roles:
      - title: Analytics Team Lead
        start: 2026-02
        end: null          # null = present
        highlights:
          - Lead the Analytics Engineering team, which owns the transformation layer (dbt on ClickHouse) and the analytics roadmap. Set up code review and quarterly planning, and keep the team on work that stakeholders use.
          - Was one of the core builders of Bankino's data platform and owned its architecture design and implementation, from design and security review to production in about seven months. It loads Oracle core banking data with dlt into MinIO and then ClickHouse, runs on Airflow on Kubernetes, and sits behind chproxy, Traefik and Authentik single sign-on.
          - "Designed the medallion (Bronze/Silver/Gold) warehouse behind Bankino's analytics: 500+ source tables from 30+ schemas, 400+ generated staging models and about 10 Silver areas, each owned by a business domain. A catalog records who owns each table, and ingestion applies a column-level PII policy (hash, mask or exclude)."
          - Leading the move of old Metabase dashboards to a new, governed instance and a 360° customer view. Wrote the team's SQL and dashboard guidelines, and led the customer demographics analysis for Marketing.
      - title: Data Engineer
        start: 2024-09
        end: 2026-02
        highlights:
          - Joined as Bankino's first data person and learned the company's data and needs from the ground up. Started with a deliberately simple stack, Airflow jobs that read from Oracle and wrote back to Oracle, with Superset and Metabase for dashboards.
          - Handled every data request from the business end to end, writing ETL where it was needed and delivering the dashboards, analyses and ad hoc answers.
          - Segmented customers by recency, frequency and monetary value (RFM); Marketing used the segments for targeted campaigns.
          - Owned the data side of Bankino's Year in Review, a personal recap of the Persian year 1403 (2024–25) for each customer, from defining the metrics to preparing the data. Also worked on the product side, deciding what each customer sees and how the slides tell their story; there were 3,600+ possible story combinations.

  - company: blu Bank
    url: https://blubank.com/
    logo: /logos/blu.svg
    location: Tehran, Iran
    roles:
      - title: Business Intelligence Developer
        start: 2024-01
        end: 2024-08
        highlights:
          - Built and improved Airflow pipelines (20+ DAGs, 40+ tables) and a star schema that made analysis faster.
          - Tuned PostgreSQL indexes and storage, which cut table sizes by up to 80% and query times by up to 50%.
          - Built Metabase dashboards and defined the main metrics for the Box and PFM features; nearly 100% of new users adopted them within 3 months.
          - Checked marketing campaigns before launch, monitored them while they ran and analyzed them afterward; the round-up campaign lifted deposits by 2%.

  - company: Mofid Securities
    url: https://www.emofid.com/
    logo: /logos/mofid.svg
    location: Tehran, Iran
    roles:
      - title: Business Intelligence Analyst
        start: 2022-07
        end: 2023-12
        highlights:
          - Rebuilt data models and validation logic, which saved up to 2 hours of manual work a day.
          - Designed and maintained 50+ dashboards in Tableau and Grafana.
          - Worked with teams across the company to define what data they needed and to read the results.

